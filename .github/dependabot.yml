version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-patch-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "golang.org/x/sys"
        update-types:
          - "patch"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-compatible-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
