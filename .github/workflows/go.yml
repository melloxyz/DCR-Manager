name: Go TUI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go build ./cmd/dcr-manager
